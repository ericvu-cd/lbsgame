<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>苑港｜魚丸追追樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#5C94FC;
    --sky-bot:#8FC8FF;
    --brick:#C84C0C;
    --brick-dark:#7B2E0B;
    --brick-mortar:#5c2108;
    --block-yellow:#FCD000;
    --block-yellow-dark:#A87000;
    --pipe-green:#22B14C;
    --pipe-green-dark:#0A6B24;
    --coin-gold:#FFD700;
    --coin-gold-dark:#B8860B;
    --water-a:#2F6FE0;
    --water-b:#3F8CF5;
    --danger-red:#E32545;
    --danger-red-dark:#8f0f2c;
    --white:#FCFCFC;
    --ink:#101010;
    --cream-dim:#DDEBFF;

    --c-normal:#22B14C;  --c-normal-ring:#0A6B24;
    --c-shark:#1E1E1E;   --c-shark-ring:#000000;
    --c-juv:#FFE066;     --c-juv-ring:#8a6c0e;
    --c-protected:#FF3B5C; --c-protected-ring:#7a0a20;
    --c-ball:#FFD700;    --c-ball-ring:#8a6c0e;
    --c-ice:#FFFFFF;     --c-ice-ring:#0B5A82;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--sky-top);
    color:var(--ink);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    user-select:none;
  }
  .pixel{ font-family:'Press Start 2P','Noto Sans TC',sans-serif; }

  #app{
    max-width:520px;
    margin:0 auto;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
    image-rendering:pixelated;
  }

  /* floating pixel clouds decoration */
  .cloud{
    position:absolute;
    width:10px; height:8px;
    background:var(--white);
    border:2px solid var(--ink);
    border-radius:1px;
    box-shadow:
      8px 0 0 0 var(--white), 8px 0 0 2px var(--ink),
      -8px 0 0 0 var(--white), -8px 0 0 2px var(--ink),
      0 -6px 0 0 var(--white), 0 -6px 0 2px var(--ink);
    opacity:0.85;
    pointer-events:none;
    z-index:0;
  }

  /* ---------- HEADER (retro HUD bar) ---------- */
  header{
    padding:6px 8px;
    padding-top:calc(6px + env(safe-area-inset-top));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    flex-shrink:0;
    z-index:2;
    background:var(--ink);
    border-bottom:3px solid var(--block-yellow-dark);
  }
  .brand{
    font-size:9.5px;
    color:var(--coin-gold);
    white-space:nowrap;
    letter-spacing:0.2px;
    text-shadow:2px 2px 0 var(--ink);
    flex-shrink:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hud-right{ display:flex; align-items:center; gap:2px; }
  .stat-pill{
    background:transparent;
    border:none;
    border-left:2px solid rgba(255,255,255,0.28);
    padding:0 9px;
    text-align:center;
    line-height:1.15;
  }
  .stat-pill:first-child{ border-left:none; padding-left:0; }
  .stat-pill .n{
    font-size:13px; display:block; color:var(--white);
    text-shadow:
      1.5px 1.5px 0 #000, -1.5px 1.5px 0 #000,
      1.5px -1.5px 0 #000, -1.5px -1.5px 0 #000,
      1.5px 0 0 #000, -1.5px 0 0 #000, 0 1.5px 0 #000, 0 -1.5px 0 #000;
  }
  .stat-pill .l{ font-size:7px; color:var(--cream-dim); letter-spacing:0.5px; }
  .stat-pill.score .n{ color:var(--coin-gold); }
  .stat-pill.ball .n{ color:var(--coin-gold); }
  .stat-pill.sus .n{ color:var(--pipe-green); }
  .timer{
    font-size:18px;
    color:var(--white);
    background:transparent;
    border:none;
    border-left:2px solid rgba(255,255,255,0.28);
    padding:0 0 0 9px;
    min-width:26px;
    text-align:center;
    text-shadow:
      1.5px 1.5px 0 #000, -1.5px 1.5px 0 #000,
      1.5px -1.5px 0 #000, -1.5px -1.5px 0 #000,
      1.5px 0 0 #000, -1.5px 0 0 #000, 0 1.5px 0 #000, 0 -1.5px 0 #000;
  }
  .timer.warn{ color:var(--danger-red); animation:pulse 0.5s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .mute-btn{
    flex-shrink:0;
    margin-left:6px;
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.28);
    border-radius:5px;
    color:var(--white);
    cursor:pointer;
    padding:0;
    line-height:1;
  }
  .mute-btn:active{ background:rgba(255,255,255,0.2); }
  .mute-btn.is-muted{ color:var(--cream-dim); opacity:0.6; }

  /* ---------- BOARD ---------- */
  #boardWrap{
    flex:1;
    position:relative;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:3px;
    z-index:1;
    overflow:hidden;
  }
  #legendBar{
    flex-shrink:0;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-auto-rows:auto;
    gap:5px 6px;
    padding:7px 8px;
    padding-bottom:calc(7px + env(safe-area-inset-bottom));
    background:var(--ink);
    border-top:3px solid var(--block-yellow-dark);
    z-index:2;
  }
  .legend-chip{
    display:flex; align-items:center; gap:5px;
    min-width:0;
    background:rgba(255,255,255,0.07);
    border:2px solid rgba(255,255,255,0.18);
    border-radius:6px;
    padding:4px 6px;
  }
  .legend-chip .icon{
    width:20px; height:20px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    border:2px solid var(--ink);
    border-radius:4px;
  }
  .legend-chip .icon.coin{
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #fff6c0 0%, #FFD700 42%, #B8860B 100%) !important;
    border:2px solid #6b4e0a;
  }
  .legend-chip .name{
    font-size:10px; color:#fff; white-space:nowrap; font-weight:500;
    overflow:hidden; text-overflow:ellipsis;
    flex:1; min-width:0;
  }
  .legend-chip .val{
    font-size:9.5px; font-weight:700; white-space:nowrap; flex-shrink:0;
  }
  #boardFrame{
    position:relative;
    z-index:2;
    border-radius:0;
    padding:9px;
    padding-bottom:15px;
    background:
      /* 每塊磚的左上高光 */
      repeating-linear-gradient(90deg, rgba(255,255,255,0.32) 0 2px, transparent 2px 20px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.22) 0 2px, transparent 2px 13px),
      /* 每塊磚的右下陰影 */
      repeating-linear-gradient(90deg, transparent 0 17px, rgba(0,0,0,0.35) 17px 20px),
      repeating-linear-gradient(0deg, transparent 0 10px, rgba(0,0,0,0.30) 10px 13px),
      var(--brick);
    border:3px solid var(--ink);
    box-shadow: 0 5px 0 rgba(0,0,0,0.35);
  }
  /* 底部草地地面條，呼應經典地面磚樣式 */
  #boardFrame::after{
    content:"";
    position:absolute;
    left:-3px; right:-3px; bottom:-3px;
    height:10px;
    background:
      repeating-linear-gradient(90deg, #3FC94A 0 8px, #2FA83B 8px 9px);
    border:3px solid var(--ink);
    border-top:2px solid #1f6b26;
    box-shadow: 0 5px 0 rgba(0,0,0,0.35);
  }
  canvas{ display:block; border:2px solid var(--ink); position:relative; z-index:1; }

  #tideCaption{
    position:absolute;
    top:-6px; left:50%; transform:translate(-50%,-100%);
    font-size:11px; color:var(--white); letter-spacing:1px;
    opacity:0; transition:opacity .4s; white-space:nowrap;
    background:var(--danger-red); padding:5px 10px; border:2px solid var(--ink);
    text-shadow:1px 1px 0 var(--ink);
  }
  #tideCaption.show{ opacity:1; }

  /* ---------- SWIPE HINT ---------- */

  #swipeHint{
    position:absolute;
    left:50%; bottom:14px; transform:translateX(-50%);
    z-index:5;
    font-size:12px;
    color:var(--white);
    background:rgba(0,0,0,0.6);
    border:2px solid var(--ink);
    padding:7px 12px;
    white-space:nowrap;
    line-height:1.7;
    text-align:center;
  }

  /* ---------- OVERLAYS (full screen, mario menu style) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
    display:flex; flex-direction:column;
    align-items:stretch; justify-content:center;
    text-align:center;
    padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:50;
    overflow:hidden; /* 整個畫面不捲動 */
  }
  #startOverlay{
    padding:0;
    overflow:hidden;
  }
  #endOverlay{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    position:fixed;
    background:
      linear-gradient(120deg, rgba(255,255,255,0.20) 0%, transparent 24%),
      linear-gradient(300deg, rgba(255,255,255,0.14) 0%, transparent 28%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.08) 0 3px, transparent 3px 18px),
      repeating-linear-gradient(90deg, rgba(0,20,60,0.06) 0 3px, transparent 3px 18px),
      radial-gradient(circle at 88% 90%, rgba(0,30,80,0.30) 0%, transparent 45%),
      linear-gradient(180deg, #1E4FA8 0%, #2F6FE0 30%, #4C93F2 62%, #8FD0FF 100%);
  }
  #endOverlay::after{
    content:"";
    position:fixed; left:0; right:0; bottom:0; height:16px;
    background:repeating-linear-gradient(90deg, #164a94 0 12px, #0f386f 12px 13px);
    border-top:3px solid var(--ink);
    z-index:0;
  }
  .end-bg-deco{
    position:absolute;
    font-size:24px;
    opacity:0.32;
    filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.2));
    pointer-events:none;
    z-index:0;
  }
  #endOverlay .overlay-inner{ justify-content:flex-start; padding-top:3vh; }
  .start-bg-wrap{
    position:relative;
    width:100%;
    flex:1;
    overflow:hidden;
  }
  .start-bg-img{
    display:block;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    user-select:none;
    -webkit-user-drag:none;
  }
  .start-bg-btn{
    position:absolute;
    background:transparent;
    border:none;
    padding:0; margin:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .start-bg-btn:active{ transform:translateY(2px); }
  .start-mute-btn{
    position:absolute;
    top:calc(10px + env(safe-area-inset-top));
    right:10px;
    z-index:10;
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    background:rgba(16,16,16,0.55);
    border:2px solid rgba(255,255,255,0.55);
    border-radius:6px;
    color:var(--white);
    cursor:pointer;
    padding:0;
    line-height:1;
  }
  .start-mute-btn:active{ background:rgba(16,16,16,0.75); }
  .start-mute-btn.is-muted{ color:var(--cream-dim); opacity:0.7; }
  .overlay-inner{
    flex:1; min-height:0;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:100%;
    justify-content:center;
    position:relative;
    z-index:1;
  }
  .overlay-inner .big-emoji, .overlay-inner h1, .overlay-inner .legend, .overlay-inner .btn{
    flex-shrink:0;
  }
  .overlay.hidden{ display:none; }
  .overlay .big-emoji{ font-size:44px; filter:drop-shadow(3px 3px 0 rgba(0,0,0,0.35)); }
  .overlay h1{
    font-size:19px; margin:0; color:var(--white);
    text-shadow:3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
    line-height:1.6;
  }
  .overlay p.lead{ color:var(--ink); font-size:14.5px; line-height:1.8; margin:0; max-width:290px; background:rgba(255,255,255,0.55); padding:8px 10px; border-radius:4px; }
  .legend{
    display:grid; grid-template-columns:1fr 1fr; gap:5px 8px; text-align:left;
    background:#fff; border:3px solid var(--ink);
    border-radius:0; padding:8px 10px; font-size:11.5px; max-width:320px;
    box-shadow:4px 4px 0 rgba(0,0,0,0.25);
  }
  .legend .row{ display:flex; align-items:center; gap:5px; }
  .legend .swatch{
    width:19px; height:19px; border-radius:4px;
    display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0;
    border:2px solid var(--ink);
  }
  .legend .swatch.coin{
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #fff6c0 0%, #FFD700 42%, #B8860B 100%);
    border:2px solid #6b4e0a;
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.28),
      inset 2px 2px 0 rgba(255,255,255,0.5);
  }
  .coin-icon{
    display:inline-block;
    width:13px; height:13px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #fff6c0 0%, #FFD700 42%, #B8860B 100%);
    border:2px solid #6b4e0a;
    box-shadow:
      inset -1.5px -1.5px 0 rgba(0,0,0,0.28),
      inset 1.5px 1.5px 0 rgba(255,255,255,0.5);
    vertical-align:middle;
    margin-right:3px;
    margin-bottom:1px;
  }
  .legend b{ font-weight:700; display:block; font-size:11px; color:var(--ink); }
  .legend span.val{ font-size:10px; opacity:0.85; }
  .legend .pos{ color:var(--pipe-green-dark); font-weight:700; }
  .legend .neg{ color:var(--danger-red-dark); font-weight:700; }

  .rules-block{
    text-align:left;
    background:#fff; border:3px solid var(--ink);
    padding:12px 14px; font-size:12.5px; max-width:320px;
    box-shadow:5px 5px 0 rgba(0,0,0,0.25);
    line-height:1.85; color:var(--ink);
  }
  .rules-block h3{
    font-size:11px; margin:10px 0 4px; color:var(--danger-red-dark);
    border-bottom:2px dashed #ccc; padding-bottom:3px;
  }
  .rules-block h3:first-child{ margin-top:0; }
  .rules-block ul{ margin:0; padding-left:18px; }
  .rules-block li{ margin-bottom:2px; }
  .rules-block .formula{
    display:block; text-align:center; font-family:'Press Start 2P';
    font-size:9px; background:#f2f2f2; border:2px dashed #999;
    padding:8px; margin:6px 0; color:var(--danger-red-dark);
  }

  .btn{
    font-size:14px;
    padding:11px 26px;
    border-radius:6px;
    border:3px solid var(--ink);
    background:var(--block-yellow);
    background-image:linear-gradient(180deg, #ffe45c, var(--block-yellow));
    color:#4a3300;
    box-shadow:0 4px 0 var(--block-yellow-dark), 0 4px 0 3px var(--ink);
    letter-spacing:1px;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--block-yellow-dark), 0 1px 0 3px var(--ink); }

  .end-btn-row{
    display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px;
    width:100%;
  }
  .btn-outline{
    font-size:12.5px;
    padding:8px 18px;
    background:rgba(255,255,255,0.85);
    background-image:none;
    color:var(--ink);
    box-shadow:0 4px 0 rgba(0,0,0,0.28), 0 4px 0 3px var(--ink);
  }
  .btn-outline:active{ box-shadow:0 1px 0 rgba(0,0,0,0.28), 0 1px 0 3px var(--ink); }

  .end-card{
    width:100%; max-width:340px;
    background:var(--white);
    border:4px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,0.35);
    text-align:left;
    flex-shrink:0;
    position:relative;
    z-index:1;
  }
  .end-card-head{
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.28) 0 2px, transparent 2px 20px),
      repeating-linear-gradient(90deg, transparent 0 17px, rgba(0,0,0,0.35) 17px 20px),
      var(--brick);
    border-bottom:4px solid var(--ink);
    padding:14px 10px 10px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .end-card-head .big-emoji{
    font-size:38px; line-height:1;
    filter:drop-shadow(2px 2px 0 rgba(0,0,0,0.45));
  }
  .end-card-head h1{
    font-size:17px; margin:6px 0 0; color:var(--coin-gold);
    text-shadow:2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
  }
  .end-card-body{ padding:14px 16px 16px; }
  .stat-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:15px; padding:7px 0;
    border-bottom:2px dashed #ddd;
  }
  .stat-row:first-child{ padding-top:0; }
  .stat-row .stat-label{ display:flex; align-items:center; gap:6px; color:var(--ink); }
  .stat-row .stat-value{ font-weight:700; color:var(--ink); }
  .final-score{
    margin-top:10px; padding:10px 12px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, #fff6c0, var(--coin-gold));
    border:3px solid var(--coin-gold-dark);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .final-score .final-label{ font-size:13px; color:#5a3d00; font-weight:700; letter-spacing:0.5px; }
  .final-score .final-value{
    font-family:'Press Start 2P','Noto Sans TC',sans-serif; font-size:19px;
    color:var(--danger-red-dark);
  }
  .end-reason{
    margin-top:9px; padding:7px 10px;
    background:#f4f4f4; border-left:4px solid var(--danger-red);
    font-size:13px; color:#444; line-height:1.5;
  }
  .lore-block{
    margin-top:10px; padding:8px 9px 7px;
    background:#FFF8E1; border:2px dashed var(--block-yellow-dark);
    color:#5a4300;
  }
  .lore-block .lore-title{
    display:flex; align-items:center; gap:5px;
    margin-bottom:4px; color:var(--danger-red-dark);
    font-size:12.5px; font-weight:700;
  }
  .lore-track{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
    gap:0;
    scrollbar-width:none;
  }
  .lore-track::-webkit-scrollbar{ display:none; }
  .lore-card{
    scroll-snap-align:start;
    flex:0 0 100%;
    min-width:100%;
    box-sizing:border-box;
    padding-right:4px;
    font-size:14px;
    line-height:1.65;
    color:#5a4300;
  }
  .lore-dots{
    display:flex; justify-content:center; gap:5px;
    margin-top:5px;
  }
  .lore-dot{
    width:5px; height:5px; border-radius:50%;
    background:#e2cd8f; transition:all .2s;
  }
  .lore-dot.active{ background:var(--block-yellow-dark); width:13px; border-radius:3px; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand pixel">🍥苑裡：魚丸追追樂</div>
    <div class="hud-right">
      <div class="stat-pill score"><span class="n pixel" id="scoreN">0</span><span class="l">分數</span></div>
      <div class="stat-pill ball"><span class="n pixel" id="ballN">0</span><span class="l">魚丸</span></div>
      <div class="stat-pill sus"><span class="n pixel" id="susN">100</span><span class="l">永續</span></div>
      <div class="timer pixel" id="timerDisplay">180</div>
      <button type="button" id="muteBtn" class="mute-btn" aria-label="音效開關" aria-pressed="false">🔊</button>
    </div>
  </header>

  <div id="boardWrap">
    <div class="cloud" style="top:6%;left:10%;"></div>
    <div class="cloud" style="top:12%;right:14%;"></div>
    <div class="cloud" style="bottom:10%;right:10%;"></div>

    <div id="boardFrame">
      <div id="tideCaption" class="pixel">潮水上漲</div>
      <canvas id="board"></canvas>

      <div id="swipeHint">👆 滑動螢幕轉向</div>
    </div>
  </div>

  <div id="legendBar">
    <div class="legend-chip"><span class="icon" style="background:var(--c-normal); border-color:var(--c-normal-ring)">🐟</span><span class="name">一般魚</span><span class="val" style="color:#7CFF9E">+5</span></div>
    <div class="legend-chip"><span class="icon" style="background:var(--c-shark); border-color:var(--c-shark-ring)">🦈</span><span class="name">鯊魚</span><span class="val" style="color:#7CFF9E">+10</span></div>
    <div class="legend-chip"><span class="icon coin" style="background:var(--c-ball); border-color:var(--c-ball-ring)">🍥</span><span class="name">魚丸</span><span class="val" style="color:#7CFF9E">+20</span></div>
    <div class="legend-chip"><span class="icon" style="background:var(--c-juv); border-color:var(--c-juv-ring)">🐠</span><span class="name">幼魚</span><span class="val" style="color:#FF8FA0">-5</span></div>
    <div class="legend-chip"><span class="icon" style="background:var(--c-protected); border-color:var(--c-protected-ring)">🚫</span><span class="name">保育魚</span><span class="val" style="color:#FF8FA0">-20</span></div>
    <div class="legend-chip"><span class="icon" style="background:var(--c-ice); border-color:var(--c-ice-ring)">🧊</span><span class="name">冰塊</span><span class="val" style="color:#8FD9FF">永續+10</span></div>
  </div>

  <!-- START (full screen) -->
  <div class="overlay" id="startOverlay">
   <button type="button" id="startMuteBtn" class="start-mute-btn" aria-label="音效開關" aria-pressed="false">🔊</button>
   <div class="start-bg-wrap" id="startBgWrap">
    <img src="fbbg.png" alt="魚丸追追樂 勇闖海洋冒險" class="start-bg-img" id="startBgImg" draggable="false">
    <button class="start-bg-btn" id="startBtn" aria-label="START"></button>
   </div>
  </div>

  <!-- GAME OVER (full screen) -->
  <div class="overlay hidden" id="endOverlay">
   <span class="end-bg-deco" style="top:8%;left:8%;">🐟</span>
   <span class="end-bg-deco" style="top:14%;right:10%;font-size:22px;">🫧</span>
   <span class="end-bg-deco" style="top:38%;left:5%;font-size:20px;">🫧</span>
   <span class="end-bg-deco" style="bottom:16%;right:8%;">🍥</span>
   <span class="end-bg-deco" style="bottom:6%;left:10%;font-size:22px;">🌊</span>
   <span class="end-bg-deco" style="top:60%;right:6%;font-size:18px;">🫧</span>
   <div class="overlay-inner">
    <div class="end-card">
      <div class="end-card-head">
        <div class="big-emoji" id="endEmoji">🏮</div>
        <h1 class="pixel" id="endTitle">收網了</h1>
      </div>
      <div class="end-card-body" id="resultBoard"></div>
    </div>
    <div class="end-btn-row">
      <button class="btn pixel" id="restartBtn">再玩一次</button>
      <button class="btn btn-outline pixel" id="backToInstructionsBtn">回到說明</button>
    </div>
   </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- SFX (procedural Web Audio, no external files) ----------
  const SFX = (function(){
    let actx = null;
    let muted = false;

    function ensureCtx(){
      if(!actx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        actx = new AC();
      }
      if(actx.state === 'suspended') actx.resume();
      return actx;
    }

    function tone(freq, dur, opts){
      opts = opts || {};
      if(muted) return;
      const c = ensureCtx();
      if(!c) return;
      try{
        const t0 = c.currentTime + (opts.delay||0);
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = opts.type || 'square';
        osc.frequency.setValueAtTime(freq, t0);
        if(opts.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20,opts.slideTo), t0+dur);
        const vol = opts.vol!==undefined ? opts.vol : 0.16;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(vol, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
        osc.connect(gain).connect(c.destination);
        osc.start(t0);
        osc.stop(t0+dur+0.03);
      }catch(e){}
    }

    function noise(dur, opts){
      opts = opts || {};
      if(muted) return;
      const c = ensureCtx();
      if(!c) return;
      try{
        const t0 = c.currentTime + (opts.delay||0);
        const size = Math.max(1, Math.floor(c.sampleRate*dur));
        const buf = c.createBuffer(1, size, c.sampleRate);
        const data = buf.getChannelData(0);
        for(let i=0;i<size;i++) data[i] = (Math.random()*2-1) * (1 - i/size);
        const src = c.createBufferSource();
        src.buffer = buf;
        const filter = c.createBiquadFilter();
        filter.type = opts.filterType || 'lowpass';
        filter.frequency.setValueAtTime(opts.freqFrom!==undefined?opts.freqFrom:1400, t0);
        if(opts.freqTo!==undefined) filter.frequency.exponentialRampToValueAtTime(Math.max(50,opts.freqTo), t0+dur);
        const gain = c.createGain();
        gain.gain.setValueAtTime(opts.vol!==undefined?opts.vol:0.18, t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
        src.connect(filter).connect(gain).connect(c.destination);
        src.start(t0);
      }catch(e){}
    }

    return {
      unlock(){ ensureCtx(); },
      setMuted(m){ muted = !!m; },
      isMuted(){ return muted; },

      uiTap(){ tone(520, 0.06, {type:'square', vol:0.12}); },

      start(){
        tone(523, 0.09, {type:'square', vol:0.15});
        tone(784, 0.12, {type:'square', vol:0.15, delay:0.09});
      },

      eatNormal(){
        tone(660, 0.07, {type:'square', vol:0.15});
        tone(990, 0.08, {type:'square', vol:0.12, delay:0.05});
      },

      eatShark(){
        tone(220, 0.1, {type:'sawtooth', vol:0.14});
        tone(330, 0.1, {type:'square', vol:0.13, delay:0.05});
        noise(0.12, {vol:0.1, freqFrom:2000, freqTo:400});
      },

      eatBad(){
        tone(300, 0.09, {type:'sawtooth', vol:0.16, slideTo:140});
        tone(180, 0.12, {type:'sawtooth', vol:0.1, delay:0.06, slideTo:90});
      },

      eatBall(){
        tone(988, 0.08, {type:'square', vol:0.17});
        tone(1319, 0.16, {type:'square', vol:0.17, delay:0.08});
      },

      eatIce(){
        tone(1500, 0.05, {type:'triangle', vol:0.12});
        tone(1900, 0.06, {type:'triangle', vol:0.09, delay:0.04});
      },

      combo(level){
        const base = 700 + Math.min(level,8)*70;
        tone(base, 0.06, {type:'square', vol:0.13});
        tone(base*1.5, 0.07, {type:'square', vol:0.11, delay:0.045});
      },

      tideWarn(){
        tone(700, 0.09, {type:'square', vol:0.14});
      },

      tideRise(){
        noise(0.35, {vol:0.16, freqFrom:1800, freqTo:150});
        tone(180, 0.3, {type:'sine', vol:0.1, slideTo:80});
      },

      win(){
        [523,659,784,1047].forEach((f,i)=>tone(f, 0.16, {type:'square', vol:0.16, delay:i*0.11}));
      },

      lose(){
        [392,330,262,196].forEach((f,i)=>tone(f, 0.18, {type:'sawtooth', vol:0.14, delay:i*0.11}));
        noise(0.3, {vol:0.08, delay:0.1, freqFrom:1000, freqTo:200});
      }
    };
  })();

  // ---------- CONFIG ----------
  const COLS = 15, ROWS = 21;
  const GAME_SECONDS = 180;
  const TICK_MS_START = 500;           // 開局每步 500ms
  const SPEEDUP_STEP_MS = 40;          // 每個週期加快 40ms
  const SPEEDUP_INTERVAL_S = 20;       // 每 20 秒加速一次
  const TICK_MS_MIN = 140;             // 180秒內共加速9次的下限（安全下限）
  const TIDE_FIRST_DELAY_MS = 25000;   // 前 25 秒完全不縮小
  const TIDE_INTERVAL_MS = 25000;      // 之後每 25 秒縮 1 格
  const TIDE_MAX_INSET = 6;
  const TIDE_WARN_MS = 1000;           // 縮小前，即將被淹沒的那一圈要先閃動警示
  const FOOD_TARGET_COUNT = 6;
  const BALL_SPAWN_EVERY = 4;

  const TYPES = {
    normal:    { emoji:"🐟", grow:1,  score:5,   sus:0,   weight:50, fill:'#22B14C', ring:'#0A6B24', comboStep:4 },
    shark:     { emoji:"🦈", grow:3,  score:10,  sus:0,   weight:14, fill:'#1E1E1E', ring:'#000000', comboStep:8 },
    juvenile:  { emoji:"🐠", grow:-1, score:-5,  sus:-5,  weight:22, fill:'#FFE066', ring:'#8a6c0e', comboStep:2 },
    protected: { emoji:"🚫", grow:-1, score:-20, sus:-20, weight:14, fill:'#FF3B5C', ring:'#7a0a20', comboStep:2 },
    ball:      { emoji:"🍥", grow:0,  score:20,  sus:0,   weight:0,  fill:'#FFD700', ring:'#8a6c0e', comboStep:12 },
    ice:       { emoji:"🧊", grow:0,  score:0,   sus:10,  weight:12, fill:'#FFFFFF', ring:'#0B5A82', comboStep:0 }
  };

  // ---------- DOM ----------
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardFrame = document.getElementById('boardFrame');
  const tideCaption = document.getElementById('tideCaption');
  const scoreN = document.getElementById('scoreN');
  const ballN = document.getElementById('ballN');
  const susN = document.getElementById('susN');
  const timerDisplay = document.getElementById('timerDisplay');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const startBgWrap = document.getElementById('startBgWrap');
  const startBgImg = document.getElementById('startBgImg');

  // fbbg.png 原始尺寸與 START 按鈕在圖片中的相對位置（比例，取自像素分析）
  const BG_IMG_NATURAL = { w:937, h:1679 };
  const START_BTN_FRAC = { left:0.318, right:0.672, top:0.895, bottom:0.982 };

  function positionStartButton(){
    const cw = startBgWrap.clientWidth, ch = startBgWrap.clientHeight;
    if(!cw || !ch) return;
    // object-fit:cover 的縮放比例：取寬高比中較大的那個，讓圖片完全覆蓋容器
    const scale = Math.max(cw / BG_IMG_NATURAL.w, ch / BG_IMG_NATURAL.h);
    const renderedW = BG_IMG_NATURAL.w * scale, renderedH = BG_IMG_NATURAL.h * scale;
    const offsetX = (renderedW - cw) / 2, offsetY = (renderedH - ch) / 2;
    const left   = START_BTN_FRAC.left   * BG_IMG_NATURAL.w * scale - offsetX;
    const right  = START_BTN_FRAC.right  * BG_IMG_NATURAL.w * scale - offsetX;
    const top    = START_BTN_FRAC.top    * BG_IMG_NATURAL.h * scale - offsetY;
    const bottom = START_BTN_FRAC.bottom * BG_IMG_NATURAL.h * scale - offsetY;
    startBtn.style.left   = left + 'px';
    startBtn.style.top    = top + 'px';
    startBtn.style.width  = (right - left) + 'px';
    startBtn.style.height = (bottom - top) + 'px';
  }
  window.addEventListener('resize', positionStartButton);
  if(startBgImg.complete) positionStartButton();
  else startBgImg.addEventListener('load', positionStartButton);
  const restartBtn = document.getElementById('restartBtn');
  const backToInstructionsBtn = document.getElementById('backToInstructionsBtn');
  const resultBoard = document.getElementById('resultBoard');
  const endTitle = document.getElementById('endTitle');
  const endEmoji = document.getElementById('endEmoji');
  const boardWrap = document.getElementById('boardWrap');
  const swipeHint = document.getElementById('swipeHint');
  const muteBtn = document.getElementById('muteBtn');
  const startMuteBtn = document.getElementById('startMuteBtn');
  const muteBtns = [muteBtn, startMuteBtn];

  function syncMuteUI(nowMuted){
    for(const b of muteBtns){
      if(!b) continue;
      b.textContent = nowMuted ? '🔇' : '🔊';
      b.classList.toggle('is-muted', nowMuted);
      b.setAttribute('aria-pressed', String(nowMuted));
    }
  }

  function toggleMute(){
    SFX.unlock();
    const nowMuted = !SFX.isMuted();
    SFX.setMuted(nowMuted);
    syncMuteUI(nowMuted);
    if(!nowMuted) SFX.uiTap();
  }

  muteBtn.addEventListener('click', toggleMute);
  startMuteBtn.addEventListener('click', toggleMute);

  // ---------- SIZE ----------
  let CELL = 22;
  function sizeCanvas(){
    const availW = boardWrap.clientWidth - 30;
    const availH = boardWrap.clientHeight - 38;
    const cellW = Math.floor(availW / COLS);
    const cellH = Math.floor(availH / ROWS);
    CELL = Math.max(16, Math.min(cellW, cellH));
    canvas.width = CELL * COLS;
    canvas.height = CELL * ROWS;
  }
  window.addEventListener('resize', sizeCanvas);

  // ---------- STATE ----------
  let snake, dir, nextDir, foods, tideInset, tickMs, tickAcc, lastTs;
  let score, sustain, fishEaten, ballEaten, fishSinceBall, running, timeLeft, timerId, rafId, floatMsgs;
  let comboKey, comboCount;
  let tideWarning = false;

  function resetState(){
    snake = [];
    const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
    for(let i=0;i<4;i++) snake.push({x:cx-i, y:cy});
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    foods = [];
    tideInset = 0;
    tickMs = TICK_MS_START;
    tickAcc = 0;
    lastTs = 0;
    score = 0;
    sustain = 100;
    fishEaten = 0;
    ballEaten = 0;
    fishSinceBall = 0;
    timeLeft = GAME_SECONDS;
    running = false;
    floatMsgs = [];
    comboKey = null;
    comboCount = 0;
    tideWarning = false;
    refillFoods();
    updateHUD();
  }

  function weightedPick(){
    const pool = [TYPES.normal, TYPES.shark, TYPES.juvenile, TYPES.protected, TYPES.ice];
    const total = pool.reduce((s,t)=>s+t.weight,0);
    let r = Math.random()*total;
    for(const t of pool){ if(r<t.weight) return t; r-=t.weight; }
    return TYPES.normal;
  }

  function cellFree(x,y){
    if(snake.some(s=>s.x===x&&s.y===y)) return false;
    if(foods.some(f=>f.x===x&&f.y===y)) return false;
    return true;
  }

  function randomFreeCell(){
    let tries=0;
    while(tries<200){
      const x = tideInset + 1 + Math.floor(Math.random()*(COLS - 2*tideInset - 2));
      const y = tideInset + 1 + Math.floor(Math.random()*(ROWS - 2*tideInset - 2));
      if(x>=0 && y>=0 && x<COLS && y<ROWS && cellFree(x,y)) return {x,y};
      tries++;
    }
    return null;
  }

  const MIN_POSITIVE_FOOD = 2; // 場上至少保留幾條正分魚，避免玩家無魚可吃

  function refillFoods(){
    while(foods.filter(f=>f.key!=='ball').length < FOOD_TARGET_COUNT){
      const type = weightedPick();
      const pos = randomFreeCell();
      if(!pos) break;
      foods.push({...pos, kind:type, key:typeKey(type)});
    }
    ensurePositiveFood();
  }

  // 保底：場上正分魚（一般魚/鯊魚）數量不足時，把場上的負分魚換成正分魚
  function ensurePositiveFood(){
    const posPool = [TYPES.normal, TYPES.shark];
    const posWeightTotal = posPool.reduce((s,t)=>s+t.weight,0);
    let guard = 0;
    while(foods.filter(f=>f.key!=='ball' && f.kind.score>0).length < MIN_POSITIVE_FOOD && guard < 10){
      guard++;
      const negIdx = foods.findIndex(f=>f.key!=='ball' && f.kind.score<0);
      if(negIdx < 0) break; // 場上已無負分魚可換，不用再處理
      let r = Math.random()*posWeightTotal, chosen = TYPES.normal;
      for(const t of posPool){ if(r<t.weight){ chosen=t; break; } r-=t.weight; }
      const pos = {x:foods[negIdx].x, y:foods[negIdx].y};
      foods[negIdx] = {...pos, kind:chosen, key:typeKey(chosen)};
    }
  }

  function typeKey(t){
    for(const k in TYPES) if(TYPES[k]===t) return k;
    return 'normal';
  }

  function spawnBall(){
    const pos = randomFreeCell();
    if(!pos) return;
    foods.push({...pos, kind:TYPES.ball, key:'ball'});
  }

  function updateHUD(){
    scoreN.textContent = score;
    ballN.textContent = ballEaten;
    susN.textContent = Math.max(0, sustain);
    timerDisplay.textContent = Math.max(0, Math.ceil(timeLeft));
    timerDisplay.classList.toggle('warn', timeLeft<=10);
  }

  function addFloat(x,y,text,color,variant){
    floatMsgs.push({x,y,text,color,variant:variant||'score',born:performance.now()});
  }

  // ---------- GAME LOOP ----------
  function step(){
    dir = nextDir;
    const head = snake[0];
    const nx = head.x + dir.x, ny = head.y + dir.y;

    const minB = tideInset, maxBx = COLS-1-tideInset, maxBy = ROWS-1-tideInset;
    if(nx<minB || nx>maxBx || ny<minB || ny>maxBy){
      return gameOver('潮水淹過了漁港邊界！');
    }
    if(snake.some(s=>s.x===nx && s.y===ny)){
      return gameOver('魚丸串撞到自己了！');
    }

    let ate = null;
    const fi = foods.findIndex(f=>f.x===nx && f.y===ny);
    if(fi>=0){ ate = foods[fi]; foods.splice(fi,1); }

    snake.unshift({x:nx,y:ny});

    if(ate){
      const t = ate.kind;

      // combo：連續吃到同一種食物會累加，好魚加碼獎勵、壞魚加碼扣分
      // 保鮮冰塊不參與 combo：既不會延續/中斷既有連線，自己也不計連線
      const isIce = ate.key === 'ice';
      if(!isIce){
        if(ate.key === comboKey){ comboCount++; } else { comboKey = ate.key; comboCount = 1; }
      }
      const comboLevel = isIce ? 0 : Math.min(comboCount, 8);
      const comboBonus = (!isIce && comboLevel >= 2) ? (comboLevel-1) * t.comboStep * (t.score >= 0 ? 1 : -1) : 0;
      const delta = t.score + comboBonus;

      score += delta;
      sustain = Math.max(0, Math.min(100, sustain + t.sus));
      if(isIce){
        addFloat(nx, ny, `永續+${t.sus}`, '#3FB6D9');
      } else {
        addFloat(nx, ny, (delta>0?'+':'')+delta, delta>0?'#22B14C':'#E32545');
        if(comboLevel >= 2){
          addFloat(nx, ny, `COMBO×${comboCount}!`, '#FF8C1A', 'combo');
          SFX.combo(comboLevel);
        }
      }

      if(ate.key==='ball'){
        ballEaten++;
        SFX.eatBall();
      } else if(isIce){
        // 保鮮冰塊不算漁獲，也不推進魚丸刷新進度
        SFX.eatIce();
      } else {
        if(ate.key==='shark') SFX.eatShark();
        else if(t.score < 0) SFX.eatBad();
        else SFX.eatNormal();
        fishEaten++;
        fishSinceBall++;
        if(fishSinceBall >= BALL_SPAWN_EVERY){
          fishSinceBall = 0;
          spawnBall();
        }
      }

      let grow = t.grow;
      while(grow < 0 && snake.length > 3){ snake.pop(); grow++; }
      if(grow <= 0){ snake.pop(); }
      for(let i=1;i<grow;i++){ snake.push({...snake[snake.length-1]}); }

      refillFoods();
      if(sustain<=0){
        return gameOver('過度捕撈，漁港生態崩潰！');
      }
    } else {
      snake.pop();
    }

    updateHUD();
  }

  const FISHBALL_LORE = [
    '苑裡沿海早年鯊魚產量豐富，但交通不便、魚肉不耐久放，盛產時常常供過於求，漁民便把鯊魚做成魚丸，Q彈鮮美，成了全台知名的苑裡特產。',
    '傳統魚丸多以鯊魚漿製成，肉質細緻不易糊爛，久煮也能維持Q彈口感，因此常被做成關東煮、火鍋料裡最耐煮的班底。',
    '現實中的鯊魚資源可不是取之不盡：台灣鯊魚漁獲量在1990年代一度逼近7.5萬公噸，到2010年只剩2萬多公噸，2012年起更禁止進口魚翅。',
    '幼魚還沒機會長大繁殖就被捕撈，會讓魚群數量一年比一年少；留住幼魚、抓大放小，才能讓漁場「年年有魚」。',
    '「保育類魚種」代表牠們的族群數量已經很稀少，一旦被捕撈就很難恢復，各國漁業法規多半明文禁捕或限捕，違者可能面臨罰則。'
  ];

  function gameOver(reason){
    running = false;
    cancelAnimationFrame(rafId);
    clearInterval(timerId);

    let emoji = '🏮', title = '收網了';
    if(reason.includes('時間到')){ emoji = '🏆'; title = '滿載而歸！'; SFX.win(); }
    else if(reason.includes('潮水')){ emoji = '🌊'; title = '被潮水追上了'; SFX.lose(); }
    else if(reason.includes('撞到自己')){ emoji = '🥢'; title = '竹籤打結了'; SFX.lose(); }
    else if(reason.includes('生態崩潰')){ emoji = '💀'; title = '生態崩潰了'; SFX.lose(); }
    endEmoji.textContent = emoji;
    endTitle.textContent = title;

    resultBoard.innerHTML =
      `<div class="stat-row"><span class="stat-label"><span class="coin-icon"></span>魚丸</span><span class="stat-value">${ballEaten} 顆</span></div>`+
      `<div class="stat-row"><span class="stat-label">🐟 漁獲</span><span class="stat-value">${fishEaten} 尾</span></div>`+
      `<div class="stat-row"><span class="stat-label">🌱 永續分數</span><span class="stat-value">${Math.max(0,sustain)}</span></div>`+
      `<div class="final-score"><span class="final-label">🏆 最終分數</span><span class="final-value">${finalScore()}</span></div>`+
      `<div class="end-reason">${reason}</div>`+
      buildKnowledgeBlock();
    endOverlay.classList.remove('hidden');
    initLoreCarousel();
  }

  function buildKnowledgeBlock(){
    const cards = FISHBALL_LORE.map(t => `<div class="lore-card">${t}</div>`).join('');
    const dots = FISHBALL_LORE.map((_,i) => `<span class="lore-dot${i===0?' active':''}"></span>`).join('');
    return `<div class="lore-block">`+
      `<div class="lore-title">💡 魚丸小知識</div>`+
      `<div class="lore-track" id="loreTrack">${cards}</div>`+
      `<div class="lore-dots" id="loreDots">${dots}</div>`+
    `</div>`;
  }

  function initLoreCarousel(){
    const track = document.getElementById('loreTrack');
    const dotsWrap = document.getElementById('loreDots');
    if(!track || !dotsWrap) return;
    const dots = dotsWrap.children;
    track.addEventListener('scroll', ()=>{
      const idx = Math.round(track.scrollLeft / track.clientWidth);
      for(let i=0;i<dots.length;i++) dots[i].classList.toggle('active', i===idx);
    }, {passive:true});
  }

  function finalScore(){
    return score + Math.max(0,sustain);
  }

  // ---------- PIXEL-STYLE FOOD BADGE ----------
  function drawCoin(f){
    const cx = f.x*CELL+CELL/2, cy = f.y*CELL+CELL/2;
    const r = CELL*0.38;
    const now = performance.now();
    const spin = Math.cos(now/260);            // -1 ~ 1，模擬硬幣轉動角度
    const scaleX = Math.max(0.14, Math.abs(spin));
    const pulse = 0.5 + 0.5*Math.sin(now/200);

    // 外圍金色光暈
    ctx.save();
    ctx.globalAlpha = 0.22 + pulse*0.22;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(cx, cy, r*1.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // 硬幣本體（水平縮放製造翻轉錯覺）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scaleX, 1);
    ctx.fillStyle = '#8a6c0e';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(0, 0, r-2, 0, Math.PI*2); ctx.fill();
    if(Math.abs(scaleX) > 0.5){
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(-r*0.25, -r*0.35, r*0.28, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // 正面/側面圖示：轉到接近正面時顯示魚丸emoji，側身時顯示細金屬邊
    if(Math.abs(scaleX) > 0.42){
      ctx.save();
      ctx.globalAlpha = Math.min(1, (Math.abs(scaleX)-0.3)/0.7);
      ctx.font = `${Math.floor(CELL*0.5)}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🍥', cx, cy+1);
      ctx.restore();
    } else {
      ctx.save();
      ctx.fillStyle = '#8a6c0e';
      ctx.fillRect(cx-1.5, cy-r, 3, r*2);
      ctx.restore();
    }
  }

  function drawFoodBadge(f){
    if(f.key==='ball'){ drawCoin(f); return; }

    const x0 = f.x*CELL, y0 = f.y*CELL;
    const pad = Math.max(2, Math.floor(CELL*0.12));
    const s = CELL - pad*2;
    const t = f.kind;
    const now = performance.now();

    // 像素方塊底
    ctx.fillStyle = t.ring;
    ctx.fillRect(x0+pad, y0+pad, s, s);
    ctx.fillStyle = t.fill;
    ctx.fillRect(x0+pad+2, y0+pad+2, s-4, s-4);
    // 左上高光（復古像素sprite的立體感）
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(x0+pad+2, y0+pad+2, s-4, Math.max(2,Math.floor(s*0.18)));
    // 黑色外框
    ctx.strokeStyle = '#101010';
    ctx.lineWidth = 2;
    ctx.strokeRect(x0+pad+1, y0+pad+1, s-2, s-2);

    ctx.font = `${Math.floor(CELL*0.58)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.fillText(t.emoji, x0+CELL/2, y0+CELL/2+1);

    // 冰塊專屬：刻面線條，讓外形本身就跟魚不一樣，不只是靠底色分辨
    if(f.key==='ice'){
      ctx.save();
      ctx.strokeStyle = 'rgba(11,90,130,0.75)';
      ctx.lineWidth = Math.max(1.4, s*0.07);
      ctx.beginPath();
      ctx.moveTo(x0+pad+s*0.12, y0+pad+s*0.88);
      ctx.lineTo(x0+pad+s*0.5,  y0+pad+s*0.32);
      ctx.moveTo(x0+pad+s*0.5,  y0+pad+s*0.32);
      ctx.lineTo(x0+pad+s*0.88, y0+pad+s*0.55);
      ctx.stroke();
      ctx.restore();
    }

    // 冰塊專屬：右上角閃光星芒，強化「反光」辨識度
    if(f.key==='ice'){
      const sparkleA = 0.5 + 0.5*Math.sin(now/260);
      const sx = x0+pad+s*0.78, sy = y0+pad+s*0.22, sr = Math.max(2, s*0.14);
      ctx.save();
      ctx.globalAlpha = sparkleA;
      ctx.strokeStyle = '#0B5A82';
      ctx.lineWidth = Math.max(1.2, s*0.05);
      ctx.beginPath();
      ctx.moveTo(sx-sr, sy); ctx.lineTo(sx+sr, sy);
      ctx.moveTo(sx, sy-sr); ctx.lineTo(sx, sy+sr);
      ctx.stroke();
      ctx.restore();
    }

    // 影響永續分數的物件（冰塊／幼魚／保育魚）統一加上閃爍外框光暈，畫在最上層才不會被蓋住
    // 傷永續越重，閃得越明顯；負面用紅色系，正面（冰塊）用藍色系
    if(t.sus !== 0){
      const severity = Math.min(1, Math.abs(t.sus)/20);
      const pulse = 0.35 + 0.45*severity*(0.5+0.5*Math.sin(now/150));
      const rgb = t.sus < 0 ? '227,37,69' : '11,90,130';
      const lw = Math.max(3, CELL*0.14);
      ctx.save();
      ctx.strokeStyle = `rgba(${rgb},${pulse})`;
      ctx.lineWidth = lw;
      ctx.strokeRect(x0+lw/2, y0+lw/2, CELL-lw, CELL-lw);
      ctx.restore();
    }
  }

  function roundRectPath(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  function cellHash(x, y){
    let h = (x*374761393 + y*668265263) | 0;
    h = Math.imul(h ^ (h >>> 16), 2246822519);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    h ^= h >>> 16;
    return (h >>> 0);
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingEnabled = false;

    // 立體像素水面方塊：每格獨立高光/陰影 + 黑色格線 + 隨機氣泡
    const now0 = performance.now();
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const px = x*CELL, py = y*CELL;
        const base = (x+y)%2===0 ? '#2F6FE0' : '#3F8CF5';
        ctx.fillStyle = base;
        ctx.fillRect(px, py, CELL, CELL);

        // 左上高光
        const bevel = Math.max(2, Math.floor(CELL*0.12));
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(px, py, CELL, bevel);
        ctx.fillRect(px, py, bevel, CELL);
        // 右下陰影
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(px, py+CELL-bevel, CELL, bevel);
        ctx.fillRect(px+CELL-bevel, py, bevel, CELL);

        // 黑色格線，讓每格更像獨立方塊
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1;
        ctx.strokeRect(px+0.5, py+0.5, CELL-1, CELL-1);

        // 隨機小氣泡（依格子座標固定產生，緩慢上下浮動）
        const hv = cellHash(x, y);
        if(hv % 100 < 14){
          const bx = px + CELL*(0.25 + (hv>>>4 & 15)/15*0.5);
          const bob = Math.sin(now0/900 + (hv%100))*1.6;
          const by = py + CELL*(0.3 + (hv>>>8 & 15)/15*0.4) + bob;
          const br = Math.max(1.2, CELL*0.09);
          ctx.fillStyle = 'rgba(255,255,255,0.55)';
          ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.beginPath(); ctx.arc(bx-br*0.3, by-br*0.3, br*0.35, 0, Math.PI*2); ctx.fill();
        }
      }
    }

    // 潮汐區：已淹沒範圍改為灰色
    if(tideInset>0){
      ctx.fillStyle = 'rgba(120,120,120,0.85)';
      ctx.fillRect(0,0,canvas.width, tideInset*CELL);
      ctx.fillRect(0,canvas.height - tideInset*CELL, canvas.width, tideInset*CELL);
      ctx.fillRect(0,0, tideInset*CELL, canvas.height);
      ctx.fillRect(canvas.width - tideInset*CELL, 0, tideInset*CELL, canvas.height);
      ctx.strokeStyle = '#101010';
      ctx.lineWidth = 3;
      ctx.strokeRect(tideInset*CELL+1, tideInset*CELL+1, canvas.width-2*tideInset*CELL-2, canvas.height-2*tideInset*CELL-2);
    }

    // 即將被淹沒的那一圈：縮小前先閃動警示，提醒玩家提早離開
    if(tideWarning){
      const ins = tideInset;
      const blink = 0.30 + 0.35*Math.sin(now0/110);
      ctx.fillStyle = `rgba(227,37,69,${blink})`;
      ctx.fillRect(ins*CELL, ins*CELL, canvas.width - 2*ins*CELL, CELL);
      ctx.fillRect(ins*CELL, canvas.height - (ins+1)*CELL, canvas.width - 2*ins*CELL, CELL);
      ctx.fillRect(ins*CELL, ins*CELL, CELL, canvas.height - 2*ins*CELL);
      ctx.fillRect(canvas.width - (ins+1)*CELL, ins*CELL, CELL, canvas.height - 2*ins*CELL);
      ctx.strokeStyle = '#101010';
      ctx.lineWidth = 2;
      ctx.strokeRect((ins+1)*CELL+1, (ins+1)*CELL+1, canvas.width-2*(ins+1)*CELL-2, canvas.height-2*(ins+1)*CELL-2);
    }

    for(const f of foods) drawFoodBadge(f);

    // 竹籤：先畫一條穿過所有魚丸中心的木籤，頭尾各露出一小截籤頭
    if(snake.length>=2){
      const centers = snake.map(s=>({x:s.x*CELL+CELL/2, y:s.y*CELL+CELL/2}));
      const head = centers[0], second = centers[1];
      const tail = centers[centers.length-1], secondLast = centers[centers.length-2];
      const headExt = { x: head.x + (head.x-second.x)*0.55, y: head.y + (head.y-second.y)*0.55 };
      const tailExt = { x: tail.x + (tail.x-secondLast.x)*0.55, y: tail.y + (tail.y-secondLast.y)*0.55 };
      ctx.strokeStyle = '#B9812E';
      ctx.lineWidth = Math.max(3, CELL*0.14);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(headExt.x, headExt.y);
      for(const c of centers) ctx.lineTo(c.x, c.y);
      ctx.lineTo(tailExt.x, tailExt.y);
      ctx.stroke();
      // 籤頭尖角（頭部那端）
      ctx.fillStyle = '#8B5A2B';
      ctx.beginPath();
      ctx.arc(headExt.x, headExt.y, Math.max(2, CELL*0.07), 0, Math.PI*2);
      ctx.fill();
    }

    // 像素圓角魚丸串（一顆顆魚丸串在竹籤上，而非蛇身）
    for(let i=snake.length-1;i>=0;i--){
      const s = snake[i];
      const x0 = s.x*CELL, y0 = s.y*CELL;
      const pad = Math.max(1, Math.floor(CELL*0.1));
      const size = CELL - pad*2;
      const r = size/2;
      const cx = x0 + CELL/2, cy = y0 + CELL/2;
      if(i===0){
        // 黑色外框圓
        ctx.fillStyle = '#101010';
        ctx.beginPath(); ctx.arc(cx, cy, r+2, 0, Math.PI*2); ctx.fill();
        // 灰白色魚丸本體
        ctx.fillStyle = '#E9E9E9';
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        // 上方高光弧，模擬圓潤反光
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.beginPath();
        ctx.ellipse(cx, cy - r*0.4, r*0.62, r*0.32, 0, 0, Math.PI*2);
        ctx.fill();
        // 像素方眼
        ctx.fillStyle = '#101010';
        const eyeSize = Math.max(2, Math.floor(size*0.16));
        const ex = dir.x*size*0.22, ey = dir.y*size*0.22;
        ctx.fillRect(cx-eyeSize/2+ex-ey*0.6, cy-eyeSize/2+ey+ex*0.6, eyeSize, eyeSize);
        ctx.fillRect(cx-eyeSize/2+ex+ey*0.6, cy-eyeSize/2+ey-ex*0.6, eyeSize, eyeSize);
      } else {
        // 黑色外框圓
        ctx.fillStyle = '#101010';
        ctx.beginPath(); ctx.arc(cx, cy, r+1, 0, Math.PI*2); ctx.fill();
        // 魚丸本體（相鄰兩顆深淺交錯的灰白色，看起來更像一串魚丸）
        ctx.fillStyle = i%2===0 ? '#F2F2F2' : '#C9C9C9';
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
        // 小反光點，強調圓潤的魚丸質感
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.ellipse(cx - r*0.28, cy - r*0.32, r*0.32, r*0.2, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // 浮動分數文字（彈出式動畫：快速放大 → 回彈 → 上飄淡出）
    const now = performance.now();
    const FLOAT_DUR = 1150;
    floatMsgs = floatMsgs.filter(m => now - m.born < FLOAT_DUR);
    for(const m of floatMsgs){
      const elapsed = now - m.born;
      let scale;
      if(elapsed < 140){ scale = 0.4 + 1.0*(elapsed/140); }
      else if(elapsed < 300){ scale = 1.4 - 0.4*((elapsed-140)/160); }
      else { scale = 1.0; }
      const driftT = Math.max(0, elapsed-220) / (FLOAT_DUR-220);
      const isCombo = m.variant === 'combo';
      const dy = -driftT*80 - (isCombo ? Math.floor(CELL*1.5) : 0); // combo標籤疊在主分數上方
      const alpha = elapsed < 320 ? 1 : Math.max(0, 1 - (elapsed-320)/(FLOAT_DUR-320));
      const px = m.x*CELL+CELL/2, py = m.y*CELL+CELL/2 + dy;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(px, py);
      ctx.scale(scale, scale);
      ctx.font = `bold ${Math.floor(CELL*(isCombo ? 0.62 : 1.68))}px monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#101010';
      ctx.lineWidth = isCombo ? 4 : 10;
      ctx.strokeText(m.text, 0, 0);
      ctx.fillStyle = m.color;
      ctx.fillText(m.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function loop(ts){
    if(!running) return;
    if(!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;

    const elapsed = Math.min(GAME_SECONDS, GAME_SECONDS - timeLeft);
    const steps = Math.floor(elapsed / SPEEDUP_INTERVAL_S);
    tickMs = Math.max(TICK_MS_MIN, TICK_MS_START - steps * SPEEDUP_STEP_MS);

    tickAcc += dt;
    while(tickAcc >= tickMs){
      tickAcc -= tickMs;
      if(running) step();
    }
    draw();
    if(running) rafId = requestAnimationFrame(loop);
  }

  // ---------- TIDE ----------
  let tideTimeoutId = null;
  function startTide(){
    scheduleTideCycle(TIDE_FIRST_DELAY_MS);
  }
  function scheduleTideCycle(delay){
    tideTimeoutId = setTimeout(()=>{
      if(!running) return;
      beginTideWarning();
    }, Math.max(0, delay - TIDE_WARN_MS));
  }
  function beginTideWarning(){
    if(!running) return;
    if(!(tideInset < TIDE_MAX_INSET && (COLS-2*(tideInset+1))>4 && (ROWS-2*(tideInset+1))>6)){
      // 已經縮到底了，不用再警示，直接排下一輪檢查
      scheduleTideCycle(TIDE_INTERVAL_MS);
      return;
    }
    tideWarning = true;
    tideCaption.textContent = '⚠️ 潮水即將上漲';
    tideCaption.classList.add('show');
    SFX.tideWarn();
    tideTimeoutId = setTimeout(()=>{
      tideWarning = false;
      raiseTide();
      scheduleTideCycle(TIDE_INTERVAL_MS);
    }, TIDE_WARN_MS);
  }
  function raiseTide(){
    if(!running) return;
    if(tideInset < TIDE_MAX_INSET && (COLS-2*(tideInset+1))>4 && (ROWS-2*(tideInset+1))>6){
      tideInset++;
      tideCaption.textContent = '潮水上漲';
      tideCaption.classList.add('show');
      SFX.tideRise();
      setTimeout(()=>tideCaption.classList.remove('show'), 1500);
      relocateSubmergedFoods();
    }
  }

  // 場地縮小後，把被新淹沒範圍蓋到的食物移回未淹沒區，而不是留在水下消失不見
  function relocateSubmergedFoods(){
    for(const f of foods){
      const submerged = f.x < tideInset || f.x >= COLS - tideInset || f.y < tideInset || f.y >= ROWS - tideInset;
      if(!submerged) continue;
      const pos = randomFreeCell();
      if(pos){ f.x = pos.x; f.y = pos.y; }
      else{ f.x = -1; f.y = -1; } // 場上真的擠不下時先移出畫面，下次 refillFoods 會自然補位
    }
    foods = foods.filter(f => f.x >= 0 && f.y >= 0);
  }

  // ---------- TIMER ----------
  function startTimer(){
    timerId = setInterval(()=>{
      if(!running) return;
      timeLeft -= 1;
      updateHUD();
      if(timeLeft<=0){
        timeLeft = 0;
        gameOver('時間到，滿載而歸！');
      }
    }, 1000);
  }

  // ---------- INPUT ----------
  function setDir(dx,dy){
    if(dir.x === -dx && dir.y === -dy) return;
    nextDir = {x:dx,y:dy};
    swipeHint.style.display = 'none';
  }
  window.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowUp') setDir(0,-1);
    if(e.key==='ArrowDown') setDir(0,1);
    if(e.key==='ArrowLeft') setDir(-1,0);
    if(e.key==='ArrowRight') setDir(1,0);
  });

  let touchStart = null;
  boardFrame.addEventListener('touchstart', (e)=>{
    const t = e.touches[0];
    touchStart = {x:t.clientX, y:t.clientY};
  }, {passive:true});
  boardFrame.addEventListener('touchend', (e)=>{
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if(Math.abs(dx) < 14 && Math.abs(dy) < 14){ touchStart=null; return; }
    if(Math.abs(dx) > Math.abs(dy)){
      setDir(dx>0?1:-1, 0);
    } else {
      setDir(0, dy>0?1:-1);
    }
    touchStart = null;
  }, {passive:true});

  // ---------- START / RESTART ----------
  function startGame(){
    SFX.unlock();
    SFX.start();
    sizeCanvas();
    resetState();
    running = true;
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    swipeHint.style.display = 'block';
    lastTs = 0;
    startTide();
    startTimer();
    rafId = requestAnimationFrame(loop);
  }

  function stopIntervals(){
    clearInterval(timerId);
    clearTimeout(tideTimeoutId);
    cancelAnimationFrame(rafId);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', ()=>{ stopIntervals(); startGame(); });
  backToInstructionsBtn.addEventListener('click', ()=>{
    SFX.uiTap();
    stopIntervals();
    running = false;
    endOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  });

  // init
  sizeCanvas();
  positionStartButton();
  resetState();
  draw();

})();
</script>
</body>
</html>

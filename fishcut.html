<h2 class="sr-only">互動demo:滑動手指或滑鼠切開飛起的漁獲得分,點擊阻止想偷魚的貓咪與客人,避免誤觸垃圾雜物,考驗你在漁市場的反應力。</h2>
<div id="wrap" style="position:relative;border:0.5px solid var(--border);border-radius:12px;background:var(--surface-1);padding:12px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;">
    <span id="score" style="font-weight:500;">分數 0</span>
    <span id="combo" style="color:var(--text-accent);"></span>
    <span id="lives"></span>
  </div>
  <div style="position:relative;">
    <canvas id="game" width="640" height="380" style="width:100%;height:380px;display:block;touch-action:none;cursor:crosshair;border-radius:8px;background:var(--surface-2);"></canvas>
    <div id="overlay" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--surface-2);border-radius:8px;text-align:center;padding:1rem;">
      <p id="ov-title" style="font-size:18px;font-weight:500;margin:0;">漁市搶救戰</p>
      <p id="ov-body" style="font-size:14px;color:var(--text-secondary);margin:0;max-width:420px;line-height:1.7;">滑過飛起的魚可以切開得分,金色是高價魚分數更高。滑過偷魚的貓咪與客人可以擋下他們。千萬別切到垃圾雜物,會扣命。</p>
      <button id="start-btn">開始遊戲</button>
    </div>
  </div>
</div>
<script>
(function(){
  var canvas=document.getElementById('game');
  var ctx=canvas.getContext('2d');
  var overlay=document.getElementById('overlay');
  var ovTitle=document.getElementById('ov-title');
  var ovBody=document.getElementById('ov-body');
  var startBtn=document.getElementById('start-btn');
  var scoreEl=document.getElementById('score');
  var comboEl=document.getElementById('combo');
  var livesEl=document.getElementById('lives');
  var W=640,H=380;
  var cs=getComputedStyle(document.documentElement);
  var colFish=cs.getPropertyValue('--fill-accent').trim()||'#378ADD';
  var colPremium=cs.getPropertyValue('--fill-warning').trim()||'#EF9F27';
  var colThief=cs.getPropertyValue('--fill-danger').trim()||'#E24B4A';
  var colJunk=cs.getPropertyValue('--text-muted').trim()||'#888780';
  var colText=cs.getPropertyValue('--text-primary').trim()||'#111';
  var g=0.32,score=0,combo=1,lives=3,running=false,spawnTimer=0,spawnEvery=70,tick=0,particles=[];
  var objs=[];
  var pts=[];
  function renderLives(){
    var s='';
    for(var i=0;i<3;i++){
      s+='<i class="ti ti-heart" style="font-size:18px;margin-left:4px;color:'+(i<lives?colThief:cs.getPropertyValue('--border').trim())+';" aria-hidden="true"></i>';
    }
    livesEl.innerHTML=s;
  }
  function reset(){
    score=0;combo=1;lives=3;objs=[];particles=[];tick=0;spawnEvery=70;
    scoreEl.textContent='分數 0';comboEl.textContent='';renderLives();
  }
  function spawn(){
    var r=Math.random();
    var type = r<0.55?'fish': r<0.7?'premium': r<0.92?'thief':'junk';
    var x=60+Math.random()*(W-120);
    var vy=-(9+Math.random()*2.2);
    var vx=(Math.random()-0.5)*3.4;
    var radius = type==='thief'?28: type==='junk'?22:24;
    objs.push({type:type,x:x,y:H+24,vx:vx,vy:vy,rot:Math.random()*6,spin:(Math.random()-0.5)*0.2,r:radius,hit:false});
  }
  function addParticle(x,y,text,color){
    particles.push({x:x,y:y,text:text,color:color,life:40});
  }
  function drawFish(o,color){
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.atan2(o.vy,o.vx));
    ctx.fillStyle=color;
    ctx.beginPath();ctx.ellipse(0,0,o.r,o.r*0.6,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-o.r*0.9,0);ctx.lineTo(-o.r*1.6,-o.r*0.5);ctx.lineTo(-o.r*1.6,o.r*0.5);ctx.closePath();ctx.fill();
    ctx.fillStyle=cs.getPropertyValue('--surface-2').trim()||'#fff';
    ctx.beginPath();ctx.arc(o.r*0.45,-o.r*0.12,o.r*0.14,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function drawThief(o){
    ctx.save();ctx.translate(o.x,o.y);
    ctx.fillStyle=colThief;
    ctx.beginPath();ctx.ellipse(0,4,o.r*0.8,o.r*0.65,0,0,Math.PI*2);ctx.fill();
    for(var i=-2;i<=2;i++){ctx.beginPath();ctx.ellipse(i*o.r*0.32, -o.r*0.55, o.r*0.16,o.r*0.42,0,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
  function drawJunk(o){
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    ctx.strokeStyle=colJunk;ctx.lineWidth=3;
    ctx.beginPath();
    for(var i=0;i<6;i++){var a=i/5*Math.PI*2;ctx.lineTo(Math.cos(a)*o.r*0.8,Math.sin(a)*o.r*0.5);}
    ctx.closePath();ctx.stroke();
    ctx.restore();
  }
  function ptSegDist(px,py,x1,y1,x2,y2){
    var dx=x2-x1,dy=y2-y1;var len2=dx*dx+dy*dy;
    if(len2===0)return Math.hypot(px-x1,py-y1);
    var t=((px-x1)*dx+(py-y1)*dy)/len2;t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }
  function processHit(o){
    o.hit=true;
    if(o.type==='fish'){score+=10*combo;combo=Math.min(combo+1,9);addParticle(o.x,o.y,'+'+(10*(combo-1)),colFish);}
    else if(o.type==='premium'){score+=30*combo;combo=Math.min(combo+1,9);addParticle(o.x,o.y,'+'+(30*(combo-1)),colPremium);}
    else if(o.type==='thief'){score+=15;addParticle(o.x,o.y,'擋下!',colThief);}
    else if(o.type==='junk'){lives=Math.max(0,lives-1);combo=1;addParticle(o.x,o.y,'-1命',colJunk);renderLives();}
    scoreEl.textContent='分數 '+score;
    comboEl.textContent = combo>1 ? (combo+' 連擊') : '';
    if(o.type==='junk' && lives===0){ endGame(); }
  }
  function endGame(){
    running=false;
    ovTitle.textContent='收攤了';
    ovBody.textContent='最終分數 '+score+',要不要再挑戰一次?';
    startBtn.textContent='再玩一次';
    overlay.style.display='flex';
  }
  function loop(){
    if(!running)return;
    tick++;
    ctx.clearRect(0,0,W,H);
    if(tick>=spawnEvery){tick=0;spawn();spawnEvery=Math.max(30,spawnEvery-1);}
    for(var i=objs.length-1;i>=0;i--){
      var o=objs[i];
      o.x+=o.vx;o.y+=o.vy;o.vy+=g;o.rot+=o.spin;
      if(!o.hit && pts.length>1){
        for(var p=1;p<pts.length;p++){
          if(ptSegDist(o.x,o.y,pts[p-1].x,pts[p-1].y,pts[p].x,pts[p].y) < o.r+6){ processHit(o); break; }
        }
      }
      if(o.type==='fish')drawFish(o,colFish);
      else if(o.type==='premium')drawFish(o,colPremium);
      else if(o.type==='thief')drawThief(o);
      else drawJunk(o);
      var offTop = o.y < -40;
      var offBottom = o.y > H+40;
      if(offTop || offBottom){
        if(!o.hit){
          if((o.type==='fish'||o.type==='premium') && offBottom){ combo=1; comboEl.textContent=''; }
          if(o.type==='thief' && offTop){ lives=Math.max(0,lives-1); combo=1; comboEl.textContent=''; renderLives(); if(lives===0){endGame();} }
        }
        objs.splice(i,1);
      }
    }
    for(var j=particles.length-1;j>=0;j--){
      var pt=particles[j];pt.life--;pt.y-=1;
      ctx.fillStyle=pt.color;ctx.font='500 14px var(--font-sans, sans-serif)';
      ctx.globalAlpha=Math.max(0,pt.life/40);
      ctx.fillText(pt.text,pt.x,pt.y);
      ctx.globalAlpha=1;
      if(pt.life<=0)particles.splice(j,1);
    }
    if(pts.length>0)pts.shift();
    requestAnimationFrame(loop);
  }
  function scalePos(clientX,clientY){
    var rect=canvas.getBoundingClientRect();
    return {x:(clientX-rect.left)/rect.width*W, y:(clientY-rect.top)/rect.height*H};
  }
  function addPoint(x,y){ pts.push({x:x,y:y}); if(pts.length>6)pts.shift(); }
  canvas.addEventListener('pointerdown',function(e){canvas.setPointerCapture(e.pointerId);var p=scalePos(e.clientX,e.clientY);pts=[p];});
  canvas.addEventListener('pointermove',function(e){if(e.buttons===0 && e.pointerType==='mouse')return;var p=scalePos(e.clientX,e.clientY);addPoint(p.x,p.y);});
  canvas.addEventListener('pointerup',function(){pts=[];});
  startBtn.addEventListener('click',function(){
    reset();overlay.style.display='none';running=true;requestAnimationFrame(loop);
  });
  renderLives();
})();
</script>
